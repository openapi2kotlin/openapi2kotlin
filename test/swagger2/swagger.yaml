swagger: "2.0"
info:
  title: Catalog
  version: v1
basePath: /catalog/v1
produces:
  - application/json
paths:
  /items/{itemId}/summaries:
    get:
      tags:
        - items
      operationId: listItemSummaries
      parameters:
        - name: itemId
          in: path
          required: true
          type: integer
          format: int64
        - name: class
          in: query
          required: false
          type: string
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/SummaryPage"
  /items/{itemId}/notes/{noteId}:
    get:
      tags:
        - items
      operationId: findNoteByItemIdAndNoteId
      parameters:
        - name: itemId
          in: path
          required: true
          type: integer
          format: int64
        - name: noteId
          in: path
          required: true
          type: integer
          format: int64
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/Summary"
  /items/{itemId}/tags/{tagId}:
    get:
      tags:
        - items
      operationId: findTagByItemIdAndTagId
      parameters:
        - name: itemId
          in: path
          required: true
          type: integer
          format: int64
        - name: tagId
          in: path
          required: true
          type: integer
          format: int64
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/Summary"
definitions:
  BaseLink:
    type: object
    properties:
      href:
        type: string
      rel:
        type: string
  SelfLink:
    type: object
    allOf:
      - $ref: "#/definitions/BaseLink"
    properties:
      href:
        example: /items/ITEM_ID/summaries
      rel:
        example: self
  SummaryLinks:
    type: object
    allOf:
      - $ref: "#/definitions/SelfLink"
  Summary:
    type: object
    required:
      - id
    properties:
      id:
        type: integer
        format: int64
      title:
        type: string
  SummaryPage:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: "#/definitions/Summary"
      _links:
        $ref: "#/definitions/SummaryLinks"
